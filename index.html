<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champions AI — Fighter Management</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --dark: #111111;
  --card: #1a1a1a;
  --border: #2a2a2a;
  --gold: #C9A84C;
  --gold-dim: #8a6f2e;
  --gold-glow: rgba(201,168,76,0.15);
  --white: #f0ede8;
  --muted: #666;
  --red: #cc3333;
  --red-bg: rgba(204,51,51,0.1);
  --green: #3a8a4a;
  --green-bg: rgba(58,138,74,0.1);
  --amber: #c47f00;
  --amber-bg: rgba(196,127,0,0.1);
  --blue: #3a6ea8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--black);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── LOGIN ── */
#login-screen {
  position: fixed; inset: 0;
  background: var(--black);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  flex-direction: column;
  gap: 0;
}

.login-box {
  width: 340px;
  text-align: center;
}

.login-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 38px;
  letter-spacing: 4px;
  color: var(--gold);
  line-height: 1;
  margin-bottom: 4px;
}

.login-sub {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 40px;
}

.login-box input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 14px 16px;
  color: var(--white);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  letter-spacing: 4px;
  text-align: center;
  outline: none;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}

.login-box input:focus { border-color: var(--gold); }

.login-btn {
  width: 100%;
  background: var(--gold);
  color: var(--black);
  border: none;
  border-radius: 4px;
  padding: 14px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.login-btn:hover { opacity: 0.85; }
.login-error { color: var(--red); font-size: 12px; margin-top: 10px; display: none; }

/* ── APP SHELL ── */
#app { display: none; flex-direction: column; min-height: 100vh; }

/* ── TOPBAR ── */
.topbar {
  background: var(--dark);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}

.topbar-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 3px;
  color: var(--gold);
}

.topbar-search {
  flex: 1;
  max-width: 400px;
  margin: 0 24px;
  position: relative;
}

.topbar-search input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px 8px 36px;
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.topbar-search input:focus { border-color: var(--gold); }
.topbar-search input::placeholder { color: var(--muted); }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }

.topbar-nav {
  display: flex;
  gap: 4px;
}

.nav-btn {
  background: none;
  border: none;
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 4px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.nav-btn:hover { color: var(--white); background: var(--card); }
.nav-btn.active { color: var(--gold); background: var(--gold-glow); }

/* ── MAIN CONTENT ── */
.main { padding: 24px 20px; max-width: 1400px; margin: 0 auto; }

/* ── SEARCH RESULTS ── */
.search-results {
  display: none;
  position: absolute;
  top: 100%;
  left: 0; right: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  margin-top: 4px;
  max-height: 400px;
  overflow-y: auto;
  z-index: 200;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

.search-result-item {
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.search-result-item:hover { background: var(--border); }
.search-result-item:last-child { border-bottom: none; }

.result-sport-badge {
  font-size: 10px;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 1px;
  padding: 2px 8px;
  border-radius: 2px;
  min-width: 40px;
  text-align: center;
}
.badge-mma { background: var(--red-bg); color: #ff6666; border: 1px solid rgba(204,51,51,0.3); }
.badge-mt { background: var(--amber-bg); color: #ffaa44; border: 1px solid rgba(196,127,0,0.3); }
.badge-grapple { background: rgba(58,110,168,0.15); color: #6699cc; border: 1px solid rgba(58,110,168,0.3); }

.result-info { flex: 1; }
.result-name { font-size: 14px; font-weight: 500; }
.result-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
.result-flag { color: var(--red); font-size: 12px; }

/* ── DASHBOARD ── */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 18px 16px;
  transition: border-color 0.2s;
}
.stat-card:hover { border-color: var(--gold-dim); }
.stat-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  color: var(--gold);
  line-height: 1;
}
.stat-label {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}

.section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.flags-grid {
  display: grid;
  gap: 8px;
  margin-bottom: 28px;
}

.flag-card {
  background: var(--red-bg);
  border: 1px solid rgba(204,51,51,0.3);
  border-radius: 6px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.flag-card:hover { background: rgba(204,51,51,0.15); }
.flag-icon { color: var(--red); font-size: 16px; }
.flag-text { flex: 1; }
.flag-name { font-size: 14px; font-weight: 500; }
.flag-detail { font-size: 12px; color: #ff8888; margin-top: 2px; }
.flag-sport { font-size: 10px; color: var(--muted); }

/* ── ROSTER TABLE ── */
.roster-controls {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn:hover, .filter-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-glow); }

.add-btn {
  background: var(--gold);
  border: none;
  color: var(--black);
  padding: 8px 18px;
  border-radius: 4px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 1px;
  cursor: pointer;
  margin-left: auto;
  transition: opacity 0.2s;
}
.add-btn:hover { opacity: 0.85; }

.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead th {
  background: var(--dark);
  padding: 10px 14px;
  text-align: left;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

tbody tr {
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
tbody tr:hover { background: rgba(201,168,76,0.05); }
tbody tr:last-child { border-bottom: none; }

tbody td {
  padding: 10px 14px;
  vertical-align: middle;
}

.td-name { font-weight: 500; color: var(--white); }
.td-gym { color: var(--muted); }
.td-record { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #aaa; }
.td-flag { color: var(--red); font-size: 12px; }

.weight-pill {
  background: var(--border);
  color: var(--white);
  padding: 2px 8px;
  border-radius: 2px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}

.camo-ok { color: var(--green); font-size: 12px; }
.camo-warn { color: var(--red); font-size: 12px; font-weight: 600; }
.camo-unknown { color: var(--muted); font-size: 12px; }

/* ── FIGHTER PROFILE ── */
#profile-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 420px;
  background: var(--dark);
  border-left: 1px solid var(--border);
  z-index: 500;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.3s ease;
  overflow: hidden;
}
#profile-panel.open { transform: translateX(0); }

.profile-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
}

.profile-close {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  float: right;
  margin-top: -4px;
}
.profile-close:hover { color: var(--white); }

.profile-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 2px;
  color: var(--white);
  margin-top: 4px;
}

.profile-meta {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.meta-pill {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 2px;
  background: var(--border);
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}

.profile-body { flex: 1; overflow-y: auto; padding: 20px; }

.profile-section { margin-bottom: 20px; }
.profile-section-title {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 10px;
}

.profile-field {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.profile-field:last-child { border-bottom: none; }
.field-label { color: var(--muted); }
.field-val { color: var(--white); font-weight: 500; text-align: right; max-width: 60%; }

.note-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 8px;
}
.note-meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
.note-text { font-size: 13px; line-height: 1.5; }

.note-input-area {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  background: var(--card);
}

.note-textarea {
  width: 100%;
  background: var(--dark);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  resize: none;
  height: 80px;
  outline: none;
  transition: border-color 0.2s;
}
.note-textarea:focus { border-color: var(--gold); }

.note-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  align-items: center;
}

.mic-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  color: var(--muted);
  cursor: pointer;
  font-size: 18px;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.mic-btn:hover { border-color: var(--gold); color: var(--gold); }
.mic-btn.recording { border-color: var(--red); color: var(--red); background: var(--red-bg); animation: pulse 1s infinite; }

@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

.save-note-btn {
  flex: 1;
  background: var(--gold);
  border: none;
  border-radius: 4px;
  padding: 8px;
  color: var(--black);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.save-note-btn:hover { opacity: 0.85; }

/* ── FIGHT CARDS ── */
.fight-card-grid { display: grid; gap: 10px; }

.bout-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  transition: border-color 0.2s;
}
.bout-card:hover { border-color: var(--gold-dim); }
.bout-card.flag { border-color: rgba(204,51,51,0.4); background: var(--red-bg); }

.bout-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.bout-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 1px;
  color: var(--gold);
}
.bout-weight {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}
.bout-status {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 2px;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 1px;
}
.status-confirmed { background: var(--green-bg); color: #66bb77; }
.status-pending { background: var(--amber-bg); color: #ffaa44; }

.bout-fighters {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: center;
}
.bout-fighter { }
.bout-fighter-name { font-size: 14px; font-weight: 500; }
.bout-fighter-gym { font-size: 11px; color: var(--muted); margin-top: 2px; }
.bout-fighter-record { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #888; margin-top: 2px; }
.bout-fighter.right { text-align: right; }
.bout-vs { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold-dim); text-align: center; }
.bout-notes { font-size: 11px; color: var(--red); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

/* ── NOTES LOG ── */
.notes-list { display: grid; gap: 8px; }
.log-note {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
}
.log-note-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
.log-note-who { font-size: 12px; color: var(--gold); font-family: 'JetBrains Mono', monospace; }
.log-note-when { font-size: 11px; color: var(--muted); }
.log-note-fighter { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.log-note-text { font-size: 13px; color: #bbb; line-height: 1.5; }

/* ── CAMO PAGE ── */
.camo-grid { display: grid; gap: 8px; }
.camo-row {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.camo-row.flag { border-color: rgba(204,51,51,0.4); background: var(--red-bg); }
.camo-row.clear { border-color: rgba(58,138,74,0.3); }
.camo-fighter { flex: 1; }
.camo-fighter-name { font-size: 14px; font-weight: 500; }
.camo-fighter-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
.camo-status-text { font-size: 12px; font-weight: 600; }
.camo-flag-text { color: var(--red); }
.camo-clear-text { color: var(--green); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 800;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--dark);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 28px;
  width: 480px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 20px;
}
.form-row { margin-bottom: 14px; }
.form-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-select option { background: var(--dark); }
.form-textarea { resize: vertical; height: 80px; }
.form-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-save {
  flex: 1;
  background: var(--gold);
  border: none;
  border-radius: 4px;
  padding: 12px;
  color: var(--black);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.modal-save:hover { opacity: 0.85; }
.modal-cancel {
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 20px;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}
.modal-cancel:hover { border-color: var(--white); color: var(--white); }

/* ── LOADING / EMPTY ── */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 14px;
}
.loading-spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--card);
  border: 1px solid var(--gold);
  border-radius: 4px;
  padding: 12px 24px;
  font-size: 13px;
  color: var(--white);
  z-index: 2000;
  transition: transform 0.3s ease;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--red); }

/* ── STICKY NOTES ── */
.sticky-notes-area {
  background: #1a1800;
  border: 1px solid #3a3200;
  border-radius: 6px;
  padding: 14px 16px;
  margin-bottom: 24px;
}
.sticky-notes-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--gold);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sticky-note-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #2a2400;
  font-size: 13px;
  color: #e8e0b8;
}
.sticky-note-item:last-of-type { border-bottom: none; }
.sticky-note-del {
  background: none;
  border: none;
  color: #554400;
  cursor: pointer;
  font-size: 16px;
  padding: 0 4px;
  flex-shrink: 0;
  min-height: 32px;
  line-height: 1;
}
.sticky-note-del:active { color: var(--red); }
.sticky-input-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.sticky-input {
  flex: 1;
  background: #111000;
  border: 1px solid #3a3200;
  border-radius: 4px;
  color: var(--white);
  padding: 8px 12px;

<script>
// ── CONFIG ──────────────────────────────────────────────────────
const SHEET_ID = '1fxyLa4EDMTHjTKSlWx0BLHYZ_Y4miCU1wFOciNCDAdA';
const API_KEY  = 'AIzaSyAixUhlqbEPOjUh4b6zSQtq43pnTZUU1eg';

const TABS = {
  mma:     'MMA Roster',
  mt:      'Muay Thai Roster',
  grapple: 'Grappling Roster',
  nm5card: 'NM5 Fight Card',
  nm6card: 'NM6 Fight Card',
  notes:   'Notes Log',
  gyms:    'Gyms',
  camo:    'CAMO Status',
  iska:    'ISKA Status'
};

// ── STATE ────────────────────────────────────────────────────────
let data = { mma:[], mt:[], grapple:[], nm5card:[], nm6card:[], notes:[], gyms:[], camo:[], iska:[] };
let currentView = 'dashboard';
let currentFighter = null;
let recognition = null;
let isRecording = false;
let localNotes = JSON.parse(localStorage.getItem('nmfc_notes') || '[]');

// ── ENTER APP ────────────────────────────────────────────────────
function enterApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';
  loadAllData();
}

// ── DATA LOADING ─────────────────────────────────────────────────
async function fetchSheet(tabName) {
  const enc = encodeURIComponent(tabName);
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${enc}!A1:Z500?key=${API_KEY}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    return json.values || [];
  } catch(e) {
    console.error('Sheet fetch error:', tabName, e);
    return [];
  }
}

function parseRoster(rows) {
  if (!rows.length) return [];
  return rows.slice(2).filter(r => r && r[1] && r[1].trim()).map(r => {
    while (r.length < 15) r.push('');
    return {
      weight:   r[0]  || '',
      name:     r[1]  || '',
      gender:   r[2]  || '',
      age:      r[3]  || '',
      record:   r[4]  || '',
      height:   r[5]  || '',
      gym:      r[6]  || '',
      contact:  r[7]  || '',
      notes:    r[8]  || '',
      flag:     r[9]  || '',
      instagram:r[10] || '',
      gymIg:    r[11] || '',
      phone:    r[12] || '',
      dob:      r[13] || '',
      email:    r[14] || ''
    };
  });
}

function parseGrapple(rows) {
  if (!rows.length) return [];
  return rows.slice(2).filter(r => r && r[1] && r[1].trim()).map(r => ({
    weight:  r[0] || '',
    name:    r[1] || '',
    gender:  r[2] || '',
    age:     r[3] || '',
    record:  r[4] || '',
    gym:     r[5] || '',
    notes:   r[6] || '',
    flag:    ''
  }));
}

function parseFightCard(rows) {
  if (!rows.length) return [];
  const bouts = [];
  for (let i = 2; i < rows.length - 1; i++) {
    const r1 = rows[i];
    const r2 = rows[i+1];
    if (!r1 || !r1[0]) continue;
    const matchNum = r1[0];
    if (!matchNum.toString().toLowerCase().includes('match')) continue;
    const f1row = rows[i+1];
    const f2row = rows[i+2];
    if (!f1row || !f2row) continue;
    bouts.push({
      match:    matchNum,
      weight:   f1row[0] || r1[0] || '',
      gym1:     f1row[1] || '',
      fighter1: f1row[2] || '',
      record1:  f1row[3] || '',
      gym2:     f2row[1] || '',
      fighter2: f2row[2] || '',
      record2:  f2row[3] || '',
      rounds:   f1row[5] || '',
      boutNotes:f1row[8] || f1row[9] || '',
      status:   f1row[4] || '',
      contacts: (f1row[7] || '') + (f2row[7] ? ' / '+f2row[7] : '')
    });
    i += 2;
  }
  return bouts;
}

function parseNotes(rows) {
  if (!rows.length) return [];
  return rows.slice(2).filter(r => r && r[4] && r[4].trim()).map(r => ({
    date:    r[0] || '',
    by:      r[1] || '',
    fighter: r[2] || '',
    sport:   r[3] || '',
    note:    (r[4] || '').replace(/\bNM5\b/g,'NMFC5').replace(/\bNM6\b/g,'NMFC6'),
    followup:r[5] || '',
    gym:     r[6] || ''
  }));
}

function parseCamo(rows) {
  if (!rows.length) return [];
  return rows.slice(2).filter(r => r && r[0] && r[0].trim()).map(r => ({
    name:    r[0] || '',
    sport:   r[1] || '',
    gym:     r[2] || '',
    camoId:  r[3] || '',
    status:  r[4] || '',
    checked: r[5] || '',
    notes:   r[6] || ''
  }));
}

async function loadAllData() {
  showLoading();
  const [mmaR, mtR, grR, nm5R, nm6R, notesR, gymsR, camoR, iskaR] = await Promise.all([
    fetchSheet(TABS.mma),
    fetchSheet(TABS.mt),
    fetchSheet(TABS.grapple),
    fetchSheet(TABS.nm5card),
    fetchSheet(TABS.nm6card),
    fetchSheet(TABS.notes),
    fetchSheet(TABS.gyms),
    fetchSheet(TABS.camo),
    fetchSheet(TABS.iska)
  ]);

  data.mma     = parseRoster(mmaR);
  data.mt      = parseRoster(mtR);
  data.grapple = parseGrapple(grR);
  data.nm5card = parseBoutCard(nm5R);
  data.nm6card = parseBoutCard(nm6R);
  data.notes   = parseNotes(notesR);
  data.gyms = gymsR.slice(2).filter(r=>r&&r[0]).map(r => {
    while (r.length < 7) r.push('');
    return {name:r[0],contact:r[1]||'',sports:r[2]||'',notes:r[3]||'',phone:r[5]||'',instagram:r[6]||''};
  });
  data.camo    = parseCamo(camoR);
  data.iska    = parseCamo(iskaR); // same structure: name, sport, gym, licenseId, status, checked, notes

  // Merge local notes
  data.notes = [...localNotes, ...data.notes];

  // Debug: log first fighter with IG and first gym with phone
  const sampleIg = data.mma.find(f=>f.instagram) || data.mt.find(f=>f.instagram);
  const sampleGym = data.gyms.find(g=>g.phone);
  console.log('[Champions AI] Sample fighter IG:', sampleIg ? `${sampleIg.name} → ${sampleIg.instagram}` : 'NONE — Instagram column empty in sheet');
  console.log('[Champions AI] Sample gym phone:', sampleGym ? `${sampleGym.name} → ${sampleGym.phone}` : 'NONE — Phone column empty in sheet');
  console.log('[Champions AI] MMA roster cols check (row 0):', data.mma[0] ? JSON.stringify(data.mma[0]) : 'empty');

  showView('dashboard');

  // Pre-build gym registry so coach panel works before Gyms tab is visited
  const gymMap = {};
  const addF = (f, sport) => {
    const key = (f.gym||'Unknown Gym').trim();
    if (!gymMap[key]) gymMap[key] = {fighters:[], contact:'', sports:new Set(), phone:'', instagram:''};
    gymMap[key].fighters.push({...f, sport});
    gymMap[key].sports.add(sport.toUpperCase());
  };
  data.mma.forEach(f => addF(f,'MMA'));
  data.mt.forEach(f => addF(f,'MT'));
  data.grapple.forEach(f => addF(f,'GRP'));
  data.gyms.forEach(g => {
    const key = (g.name||'').trim();
    if (!key) return;
    if (!gymMap[key]) gymMap[key] = {fighters:[], contact:'', sports:new Set(), phone:'', instagram:''};
    if (g.contact)   gymMap[key].contact   = g.contact;
    if (g.phone)     gymMap[key].phone     = g.phone;
    if (g.instagram) gymMap[key].instagram = g.instagram;
  });
  _gymRegistry = gymMap;
}

function parseBoutCard(rows) {
  if (!rows.length) return [];
  const bouts = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r[0]) continue;
    const cell0 = r[0].toString().toLowerCase();
    if (cell0.includes('match')) {
      const f1 = rows[i+1];
      const f2 = rows[i+2];
      if (f1 && f2) {
        bouts.push({
          match:    r[0],
          weight:   f1[0] || '',
          gym1:     f1[1] || '',
          fighter1: f1[2] || '',
          record1:  f1[3] || '',
          status:   f1[4] || '',
          rounds:   f1[5] || '',
          title:    f1[6] || '',
          contact1: f1[7] || '',
          boutNotes:f1[8] || '',
          gym2:     f2[1] || '',
          fighter2: f2[2] || '',
          record2:  f2[3] || '',
          contact2: f2[7] || ''
        });
        i += 2;
      }
    }
  }
  return bouts;
}

// ── VIEWS ────────────────────────────────────────────────────────
function showLoading() {
  document.getElementById('main-content').innerHTML = '<div class="loading"><div class="loading-spinner"></div>Loading...</div>';
}

function showView(view) {
  currentView = view;
  closeProfile();
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  const viewMap = {dashboard:0, cards:1, mma:2, mt:3, grapple:4, gyms:5, coaches:6};
  const navBtns = document.querySelectorAll('.nav-btn');
  const tabBtns = document.querySelectorAll('.tab-btn');
  if (navBtns[viewMap[view]]) navBtns[viewMap[view]].classList.add('active');
  const tabMap = {dashboard:0, cards:1, mma:2, mt:3, grapple:4, gyms:5, coaches:6};
  if (tabBtns[tabMap[view]]) tabBtns[tabMap[view]].classList.add('active');

  const mc = document.getElementById('main-content');

  if (view === 'dashboard') renderDashboard(mc);
  else if (view === 'mma') renderRoster(mc, data.mma, 'MMA', 'mma');
  else if (view === 'mt') renderRoster(mc, data.mt, 'MUAY THAI', 'mt');
  else if (view === 'grapple') renderRoster(mc, data.grapple, 'GRAPPLING', 'grapple');
  else if (view === 'gyms') renderGyms(mc);
  else if (view === 'coaches') renderCoaches(mc);
  else if (view === 'cards') renderCardBuilder(mc);
  else if (view === 'notes') renderNotes(mc);
  else if (view === 'camo') renderCamo(mc);
  else if (view === 'iska') renderIska(mc);
}

// ── DASHBOARD ────────────────────────────────────────────────────
function renderDashboard(mc) {
  const camoFlags = data.camo.filter(c => c.status && c.status.includes('⚑'));
  const totalFighters = data.mma.length + data.mt.length + data.grapple.length;

  // Next full card — always cardEvents[0] (NMFC6 seeded, future events added after)
  const nm6bouts = cardEvents[0] ? cardEvents[0].bouts : [];
  const nextEventMeta = cardEvents[0] || {};

  // Build set of fighter names on next card
  const nextEventFighterNames = new Set();
  nm6bouts.forEach(b => {
    if (b.fighter1) nextEventFighterNames.add(b.fighter1.toLowerCase().trim());
    if (b.fighter2) nextEventFighterNames.add(b.fighter2.toLowerCase().trim());
  });

  // Flags: only fighters on next card, sourced from CAMO tab only
  let flagsHtml = '';
  const eventCamoFlags = camoFlags.filter(f => nextEventFighterNames.has(f.name.toLowerCase().trim()));

  if (nextEventFighterNames.size === 0) {
    flagsHtml = '<div class="empty" style="font-size:13px;color:var(--muted)">No fighters booked yet</div>';
  } else {
    eventCamoFlags.forEach(f => {
      flagsHtml += `<div class="flag-card" onclick="searchAndOpen('${escHtml(f.name)}')">
        <span class="flag-icon">⚑</span>
        <div class="flag-text">
          <div class="flag-name">${escHtml(f.name)}</div>
          <div class="flag-detail">${escHtml(f.status)}</div>
        </div>
        <span class="flag-sport">${escHtml(f.sport)}</span>
      </div>`;
    });
    if (!flagsHtml) {
      flagsHtml = `<div class="empty">All fighters on ${escHtml(nextEventMeta.name||'NMFC6')} are clear ✓</div>`;
    }
  }

  // Recent notes
  const recentNotes = [...data.notes].slice(0, 4);
  let recentHtml = recentNotes.length ? recentNotes.map(n => `
    <div class="log-note">
      <div class="log-note-header">
        <span class="log-note-who">${escHtml(n.by||'Team')}</span>
        <span class="log-note-when">${escHtml(n.date)}</span>
      </div>
      <div class="log-note-fighter">${escHtml(n.fighter)} <span style="color:var(--muted);font-size:11px;">${escHtml(n.sport)}</span></div>
      <div class="log-note-text">${escHtml(n.note)}</div>
    </div>`).join('') : '<div class="empty">No notes yet</div>';

  // Next full card — from Sheet nm6card
  const confirmedCount = nm6bouts.filter(b => b.status && b.status.toLowerCase().includes('confirm')).length;
  let nextCardHtml = '';
  if (nm6bouts.length > 0) {
    nextCardHtml = `
      <div class="section-title" style="margin-top:0">📋 NEXT FULL CARD</div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px 20px;margin-bottom:28px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--white)">${escHtml(nextEventMeta.name||'NMFC6')}</div>

// ── ROSTER ───────────────────────────────────────────────────────
function renderRoster(mc, fighters, title, sport) {
  const flagged = fighters.filter(f=>f.flag).length;
  mc.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div>
        <div class="section-title">${title} ROSTER</div>
        <div style="font-size:12px;color:var(--muted)">${fighters.length} fighters · ${flagged} flagged</div>
      </div>
      <button class="add-btn" onclick="openAddModal('${sport}')">+ ADD FIGHTER</button>
    </div>
    <div class="roster-controls">
      <button class="filter-btn active" onclick="filterRoster(this,'all','${sport}')">All</button>
      <button class="filter-btn" onclick="filterRoster(this,'M','${sport}')">Male</button>
      <button class="filter-btn" onclick="filterRoster(this,'F','${sport}')">Female</button>
      <button class="filter-btn" onclick="filterRoster(this,'flag','${sport}')">⚑ Flagged</button>
    </div>
    <div class="table-wrap">
      <table id="roster-table">
        <thead><tr>
          <th>Weight</th><th>Fighter</th><th>M/F</th><th>Age</th>
          <th>Record</th><th>Gym</th><th>Contact</th><th>Notes</th><th>Flag</th>
        </tr></thead>
        <tbody id="roster-body"></tbody>
      </table>
    </div>`;
  renderRosterRows(fighters, sport);
}

function renderRosterRows(fighters, sport) {
  const tbody = document.getElementById('roster-body');
  if (!tbody) return;
  if (!fighters.length) { tbody.innerHTML = '<tr><td colspan="9" class="empty">No fighters found</td></tr>'; return; }
  tbody.innerHTML = fighters.map(f => `
    <tr onclick="openFighterProfile(${safeJson(f)}, '${sport}')">
      <td><span class="weight-pill">${escHtml(f.weight)}</span></td>
      <td class="td-name">${escHtml(f.name)}</td>
      <td style="color:var(--muted)">${escHtml(f.gender)}</td>
      <td style="color:var(--muted)">${escHtml(String(f.age))}</td>
      <td class="td-record">${escHtml(f.record)}</td>
      <td class="td-gym">${escHtml(f.gym)}</td>
      <td class="td-gym">${escHtml(f.contact)}</td>
      <td style="font-size:12px;color:#999;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(f.notes)}</td>
      <td class="${f.flag ? 'td-flag' : ''}">${f.flag ? '⚑' : ''}</td>
    </tr>`).join('');
}

function filterRoster(btn, filter, sport) {
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const src = sport === 'mma' ? data.mma : sport === 'mt' ? data.mt : data.grapple;
  let filtered;
  if (filter === 'all') filtered = src;
  else if (filter === 'flag') filtered = src.filter(f=>f.flag);
  else filtered = src.filter(f=>f.gender===filter);
  renderRosterRows(filtered, sport);
}

// ── GYMS ─────────────────────────────────────────────────────────
let _gymRegistry = {};

function renderGyms(mc) {
  _gymRegistry = {};

  // Build gym map from rosters
  const gymMap = {};
  const addFighter = (f, sport) => {
    const key = (f.gym || 'Unknown Gym').trim();
    if (!gymMap[key]) gymMap[key] = { fighters: [], contact:'', sports: new Set(), phone:'', instagram:'' };
    gymMap[key].fighters.push({...f, sport});
    gymMap[key].sports.add(sport.toUpperCase());
  };
  data.mma.forEach(f => addFighter(f, 'MMA'));
  data.mt.forEach(f => addFighter(f, 'MT'));
  data.grapple.forEach(f => addFighter(f, 'GRP'));

  // Merge in gyms tab data
  data.gyms.forEach(g => {
    const key = (g.name || '').trim();
    if (!key) return;
    if (!gymMap[key]) gymMap[key] = { fighters:[], contact:'', sports: new Set(), phone:'', instagram:'' };
    if (g.contact)   gymMap[key].contact   = g.contact;
    if (g.phone)     gymMap[key].phone     = g.phone;
    if (g.instagram) gymMap[key].instagram = g.instagram;
  });

  // Store in registry so onclick can access by key
  _gymRegistry = gymMap;

  const sorted = Object.keys(gymMap).sort((a,b) => gymMap[b].fighters.length - gymMap[a].fighters.length);
  const total  = data.mma.length + data.mt.length + data.grapple.length;

  mc.innerHTML = `
    <div style="margin-bottom:16px;">
      <div class="section-title">⚔️ GYM DIRECTORY</div>
      <div style="font-size:12px;color:var(--muted)">${sorted.length} gyms · ${total} fighters</div>
    </div>
    <div style="display:grid;gap:10px;">
      ${sorted.map(gymName => {
        const g = gymMap[gymName];
        const key = gymName.replace(/'/g,"\\'");
        const sportTags = [...g.sports].map(s => {
          const cls = s==='MMA'?'badge-mma':s==='MT'?'badge-mt':'badge-grapple';
          return `<span class="result-sport-badge ${cls}" style="font-size:10px">${s}</span>`;
        }).join('');
        const flagged = g.fighters.filter(f=>f.flag).length;

        return `<div class="bout-card" style="padding:14px;">

          <!-- GYM HEADER — tap name/title to open panel -->
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">
            <div onclick="openCoachPanel('${key}')" style="cursor:pointer;flex:1;">
              <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--gold)">${escHtml(gymName)}</div>
            </div>
            <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start">
              ${sportTags}
              <span style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace">${g.fighters.length}</span>
              ${flagged ? `<span style="font-size:11px;color:var(--red)">⚑${flagged}</span>` : ''}
            </div>
          </div>

          <!-- COACH + CONTACT INFO — always visible -->
          <div style="margin-bottom:10px;">
            ${g.contact ? `<div style="font-size:13px;color:var(--white);margin-bottom:6px;">👤 ${escHtml(g.contact)}</div>` : ''}
            <div style="display:flex;gap:14px;flex-wrap:wrap;">
              ${g.phone    ? `<a href="tel:${g.phone.replace(/\D/g,'')}" style="font-size:13px;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:4px;min-height:34px;">📞 ${escHtml(g.phone)}</a>` : ''}
              ${g.instagram? `<a href="https://instagram.com/${g.instagram.replace('@','')}" target="_blank" style="font-size:13px;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:4px;min-height:34px;">📷 ${escHtml(g.instagram)}</a>` : ''}
            </div>
          </div>

          <!-- FIGHTER CHIPS -->
          ${g.fighters.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px solid var(--border);">
            ${g.fighters.map(f => {
              const bc = f.sport==='MMA'?'badge-mma':f.sport==='MT'?'badge-mt':'badge-grapple';
              return `<div onclick="openFighterProfile(${safeJson(f)},'${f.sport.toLowerCase()}')" style="background:var(--border);border-radius:4px;padding:8px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;min-height:40px;">
                <span class="result-sport-badge ${bc}" style="font-size:9px;padding:1px 5px">${escHtml(f.sport)}</span>
                <span>${escHtml(f.name)}</span>
                <span style="color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px">${escHtml(f.weight)}lbs</span>
                ${f.flag ? '<span style="color:var(--red)">⚑</span>' : ''}
              </div>`;
            }).join('')}
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
}

// ── COACHES ───────────────────────────────────────────────────────
function renderCoaches(mc) {
  const coachMap = {};

  // Build from _gymRegistry (has phone, ig, fighters)
  Object.entries(_gymRegistry).forEach(([gymName, g]) => {
    if (!g.contact) return;
    const coaches = g.contact.split('/').map(c => c.trim()).filter(Boolean);
    coaches.forEach(coachName => {
      const key = coachName.toLowerCase();
      if (!coachMap[key]) {
        coachMap[key] = {
          name:      coachName,
          gym:       gymName,
          gymKey:    gymName,
          phone:     g.phone || '',
          instagram: g.instagram || '',
          sports:    [...g.sports].join(', '),
          fighters:  g.fighters || []
        };
      }
    });
  });

  // Fallback: add coaches from roster contact fields not already found
  [...data.mma, ...data.mt, ...data.grapple].forEach(f => {
    if (!f.contact) return;
    const key = f.contact.toLowerCase();
    if (!coachMap[key]) {
      const gymData = _gymRegistry[f.gym] || {};
      coachMap[key] = {
        name:      f.contact,
        gym:       f.gym || '',
        gymKey:    f.gym || '',
        phone:     gymData.phone || '',
        instagram: gymData.instagram || '',
        sports:    '',
        fighters:  gymData.fighters || []
      };
    }
  });

  const sorted = Object.values(coachMap).sort((a,b) => a.name.localeCompare(b.name));

  mc.innerHTML = `
    <div style="margin-bottom:16px;">
      <div class="section-title">🧑‍🏫 COACHES</div>
      <div style="font-size:12px;color:var(--muted)">${sorted.length} coaches · A–Z</div>
    </div>
    <div style="display:grid;gap:8px;">
      ${sorted.map(c => {
        const phoneClean = c.phone ? c.phone.replace(/\D/g,'') : '';
        const igHandle   = c.instagram ? c.instagram.replace('@','') : '';
        const safeGym    = c.gymKey.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        return `<div class="bout-card" onclick="openCoachPanel('${safeGym}')" style="padding:14px;cursor:pointer;">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:15px;font-weight:600;color:var(--white)">${escHtml(c.name)}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:2px">${escHtml(c.gym)}${c.sports ? ' · ' + escHtml(c.sports) : ''}</div>
              <div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;">
                ${c.phone    ? `<a href="tel:${phoneClean}" onclick="event.stopPropagation()" style="font-size:13px;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:4px;min-height:36px;">📞 ${escHtml(c.phone)}</a>` : ''}
                ${c.instagram? `<a href="https://instagram.com/${igHandle}" target="_blank" onclick="event.stopPropagation()" style="font-size:13px;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:4px;min-height:36px;">📷 ${escHtml(c.instagram)}</a>` : ''}
              </div>
            </div>
            <div style="color:var(--muted);font-size:20px;padding-top:4px;">›</div>
          </div>
        </div>`;
      }).join('')}
      ${!sorted.length ? '<div class="empty">No coach data — add coach names to your Gyms tab</div>' : ''}
    </div>`;
}
let stickyNotes = JSON.parse(localStorage.getItem('champions_sticky') || '[]');

function renderStickyNotes() {
  if (!stickyNotes.length) return '<div style="color:#554400;font-size:13px;padding:4px 0">No notes yet</div>';
  return stickyNotes.map((n, i) => `
    <div class="sticky-note-item">
      <button class="sticky-note-del" onclick="deleteStickyNote(${i})">✕</button>
      <span>${escHtml(n)}</span>
    </div>`).join('');
}

function addStickyNote() {
  const inp = document.getElementById('sticky-input');
  const val = inp?.value?.trim();
  if (!val) return;
  stickyNotes.unshift(val);
  localStorage.setItem('champions_sticky', JSON.stringify(stickyNotes));
  inp.value = '';
  const list = document.getElementById('sticky-notes-list');
  if (list) list.innerHTML = renderStickyNotes();
}

function deleteStickyNote(i) {
  stickyNotes.splice(i, 1);
  localStorage.setItem('champions_sticky', JSON.stringify(stickyNotes));
  const list = document.getElementById('sticky-notes-list');
  if (list) list.innerHTML = renderStickyNotes();
}

// ── COACH PROFILE ─────────────────────────────────────────────────
let coachNotes = JSON.parse(localStorage.getItem('champions_coach_notes') || '{}');
let currentGym = null;

function openCoachPanel(gymName) {
  // Strip accidental trailing quotes from template literals
  gymName = (gymName||'').replace(/'+$/, '').trim();
  const gymData = _gymRegistry[gymName];
  if (!gymData) {
    // Try partial match
    const match = Object.keys(_gymRegistry).find(k => k.toLowerCase().includes(gymName.toLowerCase()) || gymName.toLowerCase().includes(k.toLowerCase()));
    if (!match) return;
    gymName = match;
  }
  const gd = _gymRegistry[gymName];
  _currentGymData = gd;
  currentGym = gymName;
  const panel = document.getElementById('coach-panel');

  document.getElementById('coach-name').textContent = gymName;
  const sports = [...gd.sports].join(' · ');
  document.getElementById('coach-sport-badge').innerHTML = `<span style="font-size:12px;color:var(--muted);letter-spacing:1px">${sports}</span>`;
  document.getElementById('coach-meta').innerHTML = `<span class="meta-pill">${gd.fighters.length} fighters</span>`;

  const phoneClean = gd.phone ? gd.phone.replace(/\D/g,'') : '';
  const igHandle   = gd.instagram ? gd.instagram.replace('@','') : '';

  // Merge sheet notes + local coach notes for this gym
  const sheetNotes = data.notes.filter(n =>
    (n.gym && n.gym.toLowerCase() === gymName.toLowerCase()) ||
    (n.fighter && gd.fighters.some(f => f.name.toLowerCase() === n.fighter.toLowerCase()))
  );
  const localCoachNotesList = coachNotes[gymName] || [];
  const allNotes = [...localCoachNotesList, ...sheetNotes].sort((a,b) => (b.date||'').localeCompare(a.date||''));

  document.getElementById('coach-body').innerHTML = `
    <div class="profile-section">
      <div class="profile-section-title">GYM INFO</div>
      ${gd.contact    ? `<div class="profile-field"><span class="field-label">Coach</span><span class="field-val">${escHtml(gd.contact)}</span></div>` : ''}
      ${gd.phone      ? `<div class="profile-field"><span class="field-label">Phone</span><a href="tel:${phoneClean}" class="field-val field-link">📞 ${escHtml(gd.phone)}</a></div>` : ''}
      ${gd.instagram  ? `<div class="profile-field"><span class="field-label">Instagram</span><a href="https://instagram.com/${igHandle}" target="_blank" class="field-val field-link">📷 ${escHtml(gd.instagram)}</a></div>` : ''}
      ${gd.sports.size? `<div class="profile-field"><span class="field-label">Sports</span><span class="field-val">${escHtml([...gd.sports].join(', '))}</span></div>` : ''}
    </div>

    <div class="profile-section">
      <div class="profile-section-title">COACHING (${gd.fighters.length})</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">
        ${gd.fighters.map(f => {
          const bc = f.sport==='MMA'?'badge-mma':f.sport==='MT'?'badge-mt':'badge-grapple';
          return `<div onclick="openFighterProfile(${safeJson(f)},'${f.sport.toLowerCase()}')" style="background:var(--border);border-radius:4px;padding:7px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;min-height:38px;">
            <span class="result-sport-badge ${bc}" style="font-size:9px;padding:1px 5px">${f.sport}</span>
            ${escHtml(f.name)}
            <span style="color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace">${escHtml(f.weight)}lbs</span>
            ${f.flag ? '<span style="color:var(--red)">⚑</span>' : ''}
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="profile-section">
      <div class="profile-section-title">NOTES (${allNotes.length})</div>
      ${allNotes.length ? allNotes.map(n=>`
        <div class="note-item">
          <div class="note-meta">${escHtml(n.date||'')}${n.fighter ? ` · <span style="color:var(--gold);cursor:pointer" onclick="searchAndOpen('${(n.fighter||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">${escHtml(n.fighter)}</span>` : ''}</div>
          <div class="note-text">${escHtml(n.note)}</div>
        </div>`).join('') : '<div style="color:var(--muted);font-size:13px;padding:8px 0">No notes yet.</div>'}
    </div>`;

  document.getElementById('coach-note-textarea').value = '';

}

function closeCoachPanel() {
  document.getElementById('coach-panel').classList.remove('open');
  currentGym = null;
}

function saveCoachNote() {
  const text = document.getElementById('coach-note-textarea').value.trim();
  if (!text || !currentGym) return;
  if (!coachNotes[currentGym]) coachNotes[currentGym] = [];
  const now = new Date();
  const date = `${now.getMonth()+1}/${now.getDate()}/${now.getFullYear()}`;
  coachNotes[currentGym].unshift({ note: text, date });
  localStorage.setItem('champions_coach_notes', JSON.stringify(coachNotes));
  openCoachPanel(currentGym);
  showToast('Note saved ✓');
}

function checkGymConflict(g1, g2) {
  return g1 && g2 && g1.trim().toLowerCase() === g2.trim().toLowerCase();
}

function checkConflictLive() {
  const g1 = document.getElementById('b-gym1')?.value || '';
  const g2 = document.getElementById('b-gym2')?.value || '';
  const warn = document.getElementById('gym-conflict-warn');
  if (warn) warn.style.display = checkGymConflict(g1, g2) ? 'block' : 'none';
}

function autocompleteF(val, inputId, acId, gymId, recId) {

  const vl = val.toLowerCase();
  const matches = [...data.mma, ...data.mt, ...data.grapple].filter(f => f.name.toLowerCase().includes(vl)).slice(0,6);
  if (!matches.length) { ac.style.display = 'none'; return; }
  ac.innerHTML = matches.map(f => `<div style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)" 
    onmouseover="this.style.background='var(--border)'" onmouseout="this.style.background=''"

// ── VOICE INPUT ──────────────────────────────────────────────────
function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('Voice not supported on this browser', true);
    return;
  }
  if (isRecording) {
    recognition && recognition.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('mic-btn').textContent = '⏹';
  };

  recognition.onresult = (e) => {
    const transcript = Array.from(e.results).map(r=>r[0].transcript).join('');
    document.getElementById('note-textarea').value = transcript;
  };

  recognition.onend = () => {
    isRecording = false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-btn').textContent = '🎤';
  };

  recognition.onerror = () => {
    isRecording = false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-btn').textContent = '🎤';
    showToast('Mic error — check browser permissions', true);
  };

  recognition.start();
}

// ── SEARCH ───────────────────────────────────────────────────────
function handleSearch(q) {
  const dd = document.getElementById('search-dropdown');
  if (!q || q.length < 2) { dd.style.display = 'none'; return; }
  const ql = q.toLowerCase();

  const results = [];

  // Search fighters
  data.mma.forEach(f => { if(f.name.toLowerCase().includes(ql)||f.gym.toLowerCase().includes(ql)) results.push({...f,sport:'mma',type:'fighter'}); });
  data.mt.forEach(f  => { if(f.name.toLowerCase().includes(ql)||f.gym.toLowerCase().includes(ql)) results.push({...f,sport:'mt',type:'fighter'}); });
  data.grapple.forEach(f => { if(f.name.toLowerCase().includes(ql)) results.push({...f,sport:'grapple',type:'fighter'}); });

  // Search gyms
  data.gyms.forEach(g => {
    if(g.name.toLowerCase().includes(ql)||g.contact.toLowerCase().includes(ql)) {
      results.push({name:g.name, gym:g.contact, record:g.sports, weight:'', flag:'', sport:'gym', type:'gym'});
    }
  });

  // Search coaches
  data.gyms.forEach(g => {
    if (g.contact && g.contact.toLowerCase().includes(ql)) {
      results.push({ name: g.contact, gym: g.name, phone: g.phone||'', instagram: g.instagram||'', type: 'coach', gymKey: g.name });
    }
  });

  if (!results.length) { dd.style.display = 'none'; return; }

  const badgeMap = {mma:'badge-mma',mt:'badge-mt',grapple:'badge-grapple',gym:'badge-gym'};
  const labelMap = {mma:'MMA',mt:'MT',grapple:'GRP',gym:'GYM'};

  dd.innerHTML = results.slice(0,14).map(f => {
    if (f.type === 'coach') {
      const safeKey = (f.gymKey||'').replace(/'/g,"\\'");
      return `<div class="search-result-item" onclick="document.getElementById('search-dropdown').style.display='none';document.getElementById('global-search').value='';openCoachPanel('${safeKey}')">
        <span class="result-sport-badge" style="background:rgba(201,168,76,0.15);color:var(--gold);border:1px solid rgba(201,168,76,0.3)">COACH</span>
        <div class="result-info">
          <div class="result-name">${escHtml(f.name)}</div>
          <div class="result-detail">${escHtml(f.gym)}</div>
        </div>
      </div>`;
    }
    if (f.type === 'gym') {
      const safeGym = (f.name||'').replace(/'/g,"\\'");
      return `<div class="search-result-item" onclick="document.getElementById('search-dropdown').style.display='none';document.getElementById('global-search').value='';openCoachPanel('${safeGym}')">
        <span class="result-sport-badge" style="background:rgba(100,100,100,0.2);color:#aaa;border:1px solid #444">GYM</span>
        <div class="result-info">
          <div class="result-name">${escHtml(f.name)}</div>
          <div class="result-detail">${escHtml(f.gym)} · ${escHtml(f.record)}</div>
        </div>
      </div>`;
    }
    return `<div class="search-result-item" onclick="selectSearchResult(${safeJson(f)})">
      <span class="result-sport-badge ${badgeMap[f.sport]}">${labelMap[f.sport]}</span>
      <div class="result-info">
        <div class="result-name">${escHtml(f.name)}</div>
        <div class="result-detail">${escHtml(f.gym)} · ${escHtml(f.weight)} lbs · ${escHtml(f.record)}</div>
      </div>
      ${f.flag ? '<span class="result-flag">⚑</span>' : ''}
    </div>`;
  }).join('');

  dd.style.display = 'block';
}

      ${gym.sports?`<div class="profile-field"><span class="field-label">Sports</span><span class="field-val">${escHtml(gym.sports)}</span></div>`:''}
      ${gym.notes?`<div class="profile-field"><span class="field-label">Notes</span><span class="field-val">${escHtml(gym.notes)}</span></div>`:''}
    </div>
    <div class="profile-section">
      <div class="profile-section-title">FIGHTERS (${gymFighters.length})</div>
      ${gymFighters.length ? gymFighters.map(f=>`
        <div class="profile-field" style="cursor:pointer" onclick="openFighterProfile(${safeJson(f)}, '${f.sport.toLowerCase()}')">
          <span class="field-label">${escHtml(f.name)} <span style="font-size:10px;color:var(--muted)">${escHtml(f.sport)}</span></span>
          <span class="field-val" style="font-family:'JetBrains Mono',monospace;font-size:12px">${escHtml(f.record)} · ${escHtml(f.weight)}lbs</span>
        </div>`).join('') : '<div style="color:var(--muted);font-size:13px;padding:8px 0">No fighters found for this gym</div>'}
    </div>`;
  document.getElementById('note-textarea').value = '';
  panel.classList.add('open');
}

function searchAndOpen(name) {
  const fighter = [...data.mma, ...data.mt, ...data.grapple].find(f => f.name === name);
  if (fighter) openFighterProfile(fighter, fighter.sport || 'mma');
}

// Hide search on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.topbar-search')) {
    document.getElementById('search-dropdown').style.display = 'none';
  }
});

// ── ADD FIGHTER MODAL ────────────────────────────────────────────
function openAddModal(sport) {
  document.getElementById('f-sport').value = sport === 'mma' ? 'MMA' : sport === 'mt' ? 'MT' : 'Grappling';
  ['f-name','f-weight','f-age','f-record','f-height','f-gym','f-contact','f-notes'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('add-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('add-modal').classList.remove('open');
}

function saveFighter() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { showToast('Fighter name is required', true); return; }

  const sport = document.getElementById('f-sport').value;
  const newFighter = {
    weight:  document.getElementById('f-weight').value,
    name,
    gender:  document.getElementById('f-gender').value,
    age:     document.getElementById('f-age').value,
    record:  document.getElementById('f-record').value,
    height:  document.getElementById('f-height').value,
    gym:     document.getElementById('f-gym').value,
    contact: document.getElementById('f-contact').value,
    notes:   document.getElementById('f-notes').value,
    flag:    ''
  };

  const key = sport === 'MMA' ? 'mma' : sport === 'MT' ? 'mt' : 'grapple';
  data[key].unshift(newFighter);

  // Save locally
  const saved = JSON.parse(localStorage.getItem('nmfc_fighters') || '[]');
  saved.push({...newFighter, sport: key, addedAt: new Date().toISOString()});
  localStorage.setItem('nmfc_fighters', JSON.stringify(saved));

  closeModal();
  showToast(`${name} added ✓`);
  showView(key);
}

// ── UTILS ────────────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function safeJson(obj) {
  return JSON.stringify(obj).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Load saved local fighters on startup
function loadLocalFighters() {
  const saved = JSON.parse(localStorage.getItem('nmfc_fighters') || '[]');
  saved.forEach(f => {
    const key = f.sport || 'mma';
    if (data[key]) data[key].unshift(f);
  });
}
</script>
